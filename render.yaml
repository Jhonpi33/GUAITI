# Blueprint de Render: API (backend) + sitio estático (frontend)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: guaiti-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_CORREO
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # Sitio estático (Render exige type: web + runtime: static, NO type: static)
  - type: web
    name: guaiti-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://guaiti-api.onrender.com/api/v1
    # SPA fallback: sin esto, entrar directo a /login (o refrescar cualquier
    # pantalla) devolvia 404 "Not Found" porque el sitio estatico no servia
    # index.html para rutas que no son archivos reales.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
